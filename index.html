/* Floating Culture Glimpse */
.culture-float{position:fixed;right:22px;bottom:22px;width:310px;max-width:calc(100vw - 28px);z-index:9999;background:rgba(255,255,255,.97);border:1px solid #e6d7ad;border-radius:18px;box-shadow:0 14px 45px rgba(0,0,0,.18);overflow:hidden;backdrop-filter:blur(8px);animation:cultureFloatIn .55s ease both}
.culture-float-head{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:linear-gradient(135deg,var(--green),#0b7650);color:#fff;font-weight:800}
.culture-float-close{border:0;background:rgba(255,255,255,.16);color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:17px}
.culture-float-body{padding:16px 16px 14px;display:flex;gap:12px;align-items:flex-start}
.culture-float-icon{font-size:48px;line-height:1;min-width:56px;text-align:center;filter:drop-shadow(0 4px 6px rgba(0,0,0,.12))}
.culture-float h4{margin:0 0 5px;color:var(--green);font-size:18px}
.culture-float p{margin:0;font-size:13px;line-height:1.55;color:#47574f}
.culture-float-foot{padding:0 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.culture-dots{font-size:11px;color:#8a8a8a}
.culture-next{border:1px solid #d7e3dc;background:#f4faf7;color:var(--green);padding:6px 10px;border-radius:20px;font-weight:700;cursor:pointer}
@keyframes cultureFloatIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.culture-float.swap .culture-float-body{animation:cultureSwap .45s ease}
@keyframes cultureSwap{0%{opacity:.35;transform:translateY(8px)}100%{opacity:1;transform:none}}
@media(max-width:600px){.culture-float{right:10px;bottom:10px;width:calc(100vw - 20px)}.culture-float-body{padding:13px}.culture-float-icon{font-size:40px;min-width:48px}.culture-float h4{font-size:16px}.culture-float p{font-size:12px}}
